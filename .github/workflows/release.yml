name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 windows/amd64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            name="clipboard-river-server_${GOOS}_${GOARCH}"
            package_dir="dist/$name"
            mkdir -p "$package_dir"
            suffix=""
            if [[ "$GOOS" == windows ]]; then suffix=".exe"; fi
            go build -trimpath -ldflags "-s -w -X main.version=$RELEASE_TAG" -o "$package_dir/clipboard-river-server$suffix" ./cmd/cb-river-server
            cp config.example.json README.md README.zh-CN.md ApiRef.md "$package_dir/"
            cp -R Assets "$package_dir/"
            for license in LICENSE LICENSE.md LICENSE.txt; do
              if [[ -f "$license" ]]; then cp "$license" "$package_dir/"; fi
            done
            if [[ "$GOOS" == windows ]]; then
              (cd dist && python3 -m zipfile -c "$name.zip" "$name")
            else
              tar -C dist -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cat > release-notes.md <<'EOF'
          ## Run / 启动

          Download the archive matching your OS and CPU, extract it, and open a terminal in the extracted directory. Go is not required.
          下载对应系统和 CPU 架构的压缩包，解压后在该目录打开终端，无需安装 Go。

          Linux:
          ```bash
          ./clipboard-river-server --config ./config.json
          ```

          Windows (PowerShell):
          ```powershell
          .\clipboard-river-server.exe --config .\config.json
          ```

          - `--config <path>`: configuration file / 配置文件，缺失时自动生成。
          - `--version`: print version / 查看版本。
          - `--help`: show help / 查看帮助。

          Set the listen address and other server options in the JSON config file, for example `server.listen_addr` is `:8080` by default.
          监听地址等服务端选项统一在 JSON 配置中设置，默认 `server.listen_addr` 为 `:8080`。

          The initial admin password is printed in the startup log. Open http://127.0.0.1:8080/admin/login and enable enrollment to register clients.
          首次管理员密码见启动日志；打开 http://127.0.0.1:8080/admin/login，开启接入后注册客户端。

          See the included README files for configuration and build instructions. `SHA256SUMS` contains the archive checksums.
          完整配置和构建说明见包内 README；压缩包校验值见 `SHA256SUMS`。
          EOF
          gh release create "$RELEASE_TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md --generate-notes
